<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internal Router</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5d6677;
    --line: #dde1e8; --accent: #2f6fdf; --accent-text: #ffffff; --danger: #c43c3c;
    --input: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171d; --panel: #1c2028; --text: #e6e9ef; --muted: #98a1b3;
      --line: #2e3440; --accent: #5b8ff0; --accent-text: #0d1117; --danger: #ef6b6b;
      --input: #232833;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 820px; margin: 0 auto; padding: 32px 16px 48px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  header img { width: 36px; height: 36px; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--muted); margin: 2px 0 0; font-size: 14px; }
  section {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 20px; margin-bottom: 20px;
  }
  h2 { font-size: 16px; margin: 0 0 14px; }
  form { display: grid; grid-template-columns: 1fr 2fr auto; gap: 10px; align-items: end; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input[type=text] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--input); color: var(--text); font: inherit;
  }
  .name-wrap { display: flex; align-items: center; gap: 4px; }
  .name-wrap span { color: var(--muted); white-space: nowrap; }
  .check { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  button {
    padding: 8px 16px; border: 0; border-radius: 6px; font: inherit; cursor: pointer;
    background: var(--accent); color: var(--accent-text);
  }
  button.link { background: transparent; color: var(--accent); padding: 4px 8px; }
  button.link.danger { color: var(--danger); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 13px; color: var(--muted); font-weight: 600; }
  td { word-break: break-all; }
  td:last-child { text-align: right; width: 1%; white-space: nowrap; }
  a { color: var(--accent); }
  .tag { font-size: 12px; color: var(--muted); }
  #msg { min-height: 1.5em; margin: 10px 0 0; font-size: 14px; }
  #msg.error { color: var(--danger); }
  .empty { color: var(--muted); padding: 8px 0; }
  @media (max-width: 600px) {
    form { grid-template-columns: 1fr; }
    th:nth-child(2), td:nth-child(2) { display: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <img src="/icon.svg" alt="">
    <div>
      <h1>Internal Router</h1>
      <p class="sub">Names under one private domain, each pointing at a VM or container.</p>
    </div>
  </header>

  <section>
    <h2>Add or change a name</h2>
    <form id="add">
      <div>
        <label for="name">Name</label>
        <div class="name-wrap"><input type="text" id="name" required pattern="[a-z0-9]([a-z0-9\-]{0,61}[a-z0-9])?" autocomplete="off" placeholder="gym"><span id="suffix">.internal</span></div>
      </div>
      <div>
        <label for="target">Target</label>
        <input type="text" id="target" required autocomplete="off" placeholder="http://100.64.0.10:8080">
      </div>
      <button type="submit">Save</button>
      <label class="check"><input type="checkbox" id="insecure"> Target uses HTTPS with a certificate the router cannot verify</label>
    </form>
    <p id="msg"></p>
  </section>

  <section>
    <h2>Names</h2>
    <table>
      <thead><tr><th>Name</th><th>Target</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="empty" id="empty" hidden>No names yet.</p>
  </section>
</main>
<script>
let domain = "internal";
const $ = (id) => document.getElementById(id);

function say(text, isError) {
  $("msg").textContent = text;
  $("msg").className = isError ? "error" : "";
}

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    let err = res.status + " " + res.statusText;
    try { err = (await res.json()).error || err; } catch (e) {}
    throw new Error(err);
  }
  return res.status === 204 ? null : res.json();
}

function button(text, cls, onClick) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = cls;
  b.textContent = text;
  b.onclick = onClick;
  return b;
}

function render(routes) {
  const rows = $("rows");
  rows.replaceChildren();
  $("empty").hidden = routes.length > 0;
  for (const r of routes) {
    const host = r.name + "." + domain;
    const tr = document.createElement("tr");

    const nameTd = document.createElement("td");
    const link = document.createElement("a");
    link.href = "https://" + host + "/";
    link.textContent = host;
    nameTd.append(link);

    const targetTd = document.createElement("td");
    targetTd.textContent = r.target;
    if (r.insecure_tls) {
      const tag = document.createElement("div");
      tag.className = "tag";
      tag.textContent = "certificate not checked";
      targetTd.append(tag);
    }

    const actionTd = document.createElement("td");
    actionTd.append(
      button("Edit", "link", () => {
        $("name").value = r.name;
        $("target").value = r.target;
        $("insecure").checked = !!r.insecure_tls;
        $("target").focus();
      }),
      button("Delete", "link danger", async () => {
        if (!confirm("Delete " + host + "?")) return;
        try {
          await api("DELETE", "/api/routes/" + encodeURIComponent(r.name));
          say("Deleted " + host + ".");
          load();
        } catch (e) { say(e.message, true); }
      }),
    );

    tr.append(nameTd, targetTd, actionTd);
    rows.append(tr);
  }
}

async function load() {
  try { render(await api("GET", "/api/routes")); }
  catch (e) { say("Could not load names: " + e.message, true); }
}

$("add").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const name = $("name").value.trim().toLowerCase();
  try {
    await api("PUT", "/api/routes/" + encodeURIComponent(name), {
      target: $("target").value.trim(),
      insecure_tls: $("insecure").checked,
    });
    say("Saved " + name + "." + domain + ". The first visit can take a few seconds while its certificate is issued.");
    $("add").reset();
    load();
  } catch (e) { say(e.message, true); }
});

api("GET", "/api/info").then((info) => {
  domain = info.domain;
  $("suffix").textContent = "." + domain;
  load();
}).catch((e) => say("Could not reach the router: " + e.message, true));
</script>
</body>
</html>
