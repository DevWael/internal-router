name: internal-router

services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: router
    restart: unless-stopped
    environment:
      - TS_HOSTNAME=router
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_AUTH_ONCE=true
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
      - TS_AUTHKEY=${TS_AUTHKEY:-}
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    volumes:
      - ./tailscale:/var/lib/tailscale
      - ./run:/var/run/tailscale

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      - tailscale
    command: ["caddy", "run", "--resume"]
    healthcheck:
      test: ["CMD-SHELL", "grep -q tailscale0: /proc/net/dev || kill 1"]
      interval: 30s
      timeout: 5s
    volumes:
      - ./ca:/ca:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
      - ./resolv.conf:/etc/resolv.conf:ro

  router:
    image: ghcr.io/devwael/internal-router:latest
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      - caddy
    environment:
      - ROUTER_DOMAIN=internal
      - ROUTER_NAME=router
      - CA_ROOT_CERT=/ca/ca.crt
      - CA_ROOT_KEY=/ca/ca.key
    volumes:
      - ./data:/data
      - ./run:/var/run/tailscale:ro
