name: internal-router-test

services:
  net:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    ports:
      - "127.0.0.1:18443:443"
      - "127.0.0.1:18053:53/udp"
      - "127.0.0.1:18053:53/tcp"

  caddy:
    image: caddy:2-alpine
    network_mode: service:net
    command: ["caddy", "run", "--resume"]
    volumes:
      - ./ca:/ca:ro
      - caddy-data:/data
      - caddy-config:/config

  router:
    build: ..
    network_mode: service:net
    environment:
      - ROUTER_DNS_INTERFACE=
      - ROUTER_DNS_IPV4=10.9.9.9
      - CA_ROOT_CERT=/ca/ca.crt
      - CA_ROOT_KEY=/ca/ca.key
      - CA_INTERMEDIATE_CERT=/ca/ca.crt
      - CA_INTERMEDIATE_KEY=/ca/ca.key
    volumes:
      - router-data:/data

  whoami:
    image: traefik/whoami:v1.10

volumes:
  caddy-data:
  caddy-config:
  router-data:
